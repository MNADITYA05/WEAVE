version: "3.9"

services:

  # ── Simulation backend (FastAPI + ngspice) ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NGSPICE_BIN=ngspice
      - NGSPICE_TIMEOUT=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend dev server (Vite) ───────────────────────────────────────────────
  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_SIM_BACKEND=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
